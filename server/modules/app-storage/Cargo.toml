[package]
name = "app-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sqlx.workspace = true
uuid = { version = "1", features = ["v4"] }
image = "0.25"
sha1 = "0.10"
thiserror = "2"
flash-core = { path = "../flash-core" }

# OSS (S3 兼容)
aws-config = "1"
aws-sdk-s3 = "1"
aws-credential-types = "1"
aws-types = "1"

# STS 签名
reqwest = { version = "0.12", features = ["json"] }
hmac = "0.12"
base64 = "0.22"
percent-encoding = "2"
rand = "0.9"

[dev-dependencies]
dotenvy = "0.15"
